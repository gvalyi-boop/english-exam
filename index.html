<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Advanced Grammar Quiz</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="meta-label" class="meta-label">
    Updated: 2026-11-22 &nbsp;·&nbsp; <span id="pool-size">…</span> questions
  </div>

  <!-- WELCOME PAGE -->
  <div id="page-welcome" class="page active">
    <div class="card welcome-card">
      <div class="flag">🇬🇧</div>
      <h1>English Advanced<br>Grammar Quiz</h1>
      <p class="subtitle">Emelt szintű érettségi előkészítő</p>
      <div class="info-box">
        <div class="info-item">
          <span class="info-icon">📝</span>
          <span>20 random questions</span>
        </div>
        <div class="info-item">
          <span class="info-icon">✅</span>
          <span>One correct answer each</span>
        </div>
        <div class="info-item">
          <span class="info-icon">💡</span>
          <span>Answer revealed after each question</span>
        </div>
      </div>
      <button id="btn-start" class="btn btn-primary btn-large">Start Quiz</button>
    </div>
  </div>

  <!-- QUESTION PAGE -->
  <div id="page-question" class="page">
    <div class="quiz-header">
      <div class="progress-info">
        <span id="q-counter">Question 1 / 20</span>
        <span id="q-score">Score: 0</span>
      </div>
      <div class="progress-bar-track">
        <div id="progress-bar" class="progress-bar-fill"></div>
      </div>
      <div id="q-topic" class="topic-badge"></div>
    </div>

    <div class="question-body">
      <p id="q-text" class="question-text"></p>

      <div id="options-container" class="options-list"></div>
    </div>

    <div id="feedback-area" class="feedback-area hidden">
      <div id="feedback-box" class="feedback-box"></div>
      <button id="btn-next" class="btn btn-primary">Next →</button>
    </div>
  </div>

  <!-- COMPLETION PAGE -->
  <div id="page-done" class="page">
    <div class="card done-card">
      <div id="done-emoji" class="done-emoji"></div>
      <h1>Quiz Complete!</h1>
      <p id="done-msg" class="done-msg"></p>
      <div id="done-score-box" class="done-score-box">
        <span id="done-score-num" class="done-score-num"></span>
        <span class="done-score-label">out of 20</span>
      </div>
      <div id="done-breakdown" class="done-breakdown"></div>
      <button id="btn-restart" class="btn btn-primary btn-large">Try Again</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
